<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CleverTap Web SDK — Login / Signup</title>

    <script>
      (function () {
        var CT_ID_KEY = "ct_prefs.clevertap_id";
        var ctId = localStorage.getItem(CT_ID_KEY);
        if (!ctId) {
          // mirrors: CleverTapIdManager.generateId()
          var raw = ([1e7] + -1e3 + -4e3 + -8e3 + -1e11)
            .replace(/[018]/g, function (c) {
              return (
                c ^
                (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))
              ).toString(16);
            })
            .replace(/-/g, "");
          ctId = raw.slice(0, 20) + "-sp";
          localStorage.setItem(CT_ID_KEY, ctId);
        }

        window.__CT_INIT_ID__ = ctId;
      })();
    </script>

    <script type="text/javascript">
      var clevertap = {
        event: [],
        profile: [],
        account: [],
        onUserLogin: [],
        notifications: [],
        privacy: [],
        config: { customId: window.__CT_INIT_ID__ },
      };

      var CT_ACCOUNT_ID = "W8W-6WR-846Z";

      clevertap.account.push({ id: CT_ACCOUNT_ID });
      clevertap.privacy.push({ optOut: false });
      clevertap.privacy.push({ useIP: false });

      (function () {
        var wzrk = document.createElement("script");
        wzrk.type = "text/javascript";
        wzrk.async = true;
        wzrk.src =
          ("https:" === document.location.protocol
            ? "https://d2r1yp2w7bby2u.cloudfront.net"
            : "http://static.clevertap.com") + "/js/clevertap.min.js";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(wzrk, s);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0a0a0f;
        --surface: #111118;
        --border: #1e1e2e;
        --accent: #6c63ff;
        --accent-2: #ff6584;
        --text: #e8e8f0;
        --muted: #666680;
        --input-bg: #16161f;
        --success: #43e97b;
        --error: #ff6b6b;
        --radius: 12px;
        --font-head: "Syne", sans-serif;
        --font-body: "DM Sans", sans-serif;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        font-weight: 300;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(
            ellipse 80% 60% at 20% 10%,
            rgba(108, 99, 255, 0.12) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse 60% 50% at 80% 90%,
            rgba(255, 101, 132, 0.08) 0%,
            transparent 60%
          );
      }
      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        position: relative;
        z-index: 1;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 40px 36px 36px;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.5s ease both;
      }
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
      }
      .logo-mark {
        width: 36px;
        height: 36px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-head);
        font-weight: 800;
        font-size: 16px;
        color: #fff;
        flex-shrink: 0;
      }
      .logo-text {
        font-family: var(--font-head);
        font-weight: 700;
        font-size: 17px;
        letter-spacing: -0.3px;
      }
      .logo-sub {
        font-size: 11px;
        color: var(--muted);
        font-weight: 400;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .tabs {
        display: flex;
        background: var(--input-bg);
        border-radius: 10px;
        padding: 4px;
        margin-bottom: 28px;
        gap: 4px;
      }
      .tab {
        flex: 1;
        padding: 9px;
        border: none;
        background: transparent;
        color: var(--muted);
        font-family: var(--font-body);
        font-size: 13.5px;
        font-weight: 500;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .tab.active {
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
      }
      .form {
        display: none;
        flex-direction: column;
        gap: 16px;
      }
      .form.visible {
        display: flex;
        animation: fadeIn 0.25s ease both;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      label {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      input {
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        color: var(--text);
        font-family: var(--font-body);
        font-size: 14px;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      input::placeholder {
        color: var(--muted);
        opacity: 0.6;
      }
      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.12);
      }
      .phone-row {
        display: flex;
        gap: 8px;
      }
      .country-code {
        width: 72px;
        flex-shrink: 0;
        text-align: center;
      }
      .btn {
        padding: 13px;
        border: none;
        border-radius: var(--radius);
        font-family: var(--font-head);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.4px;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 4px;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--accent), #8b84ff);
        color: #fff;
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(108, 99, 255, 0.35);
      }
      .btn-primary:active {
        transform: translateY(0);
      }
      #toast {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 3px solid var(--success);
        color: var(--text);
        padding: 12px 20px;
        border-radius: 10px;
        font-size: 13.5px;
        font-weight: 500;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        transition:
          transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
          opacity 0.3s;
        opacity: 0;
        z-index: 1000;
      }
      #toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
      .debug {
        margin-top: 24px;
        padding: 14px;
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 11.5px;
        font-family: "Courier New", monospace;
        color: var(--muted);
        line-height: 1.9;
      }
      .debug strong {
        color: var(--accent);
        font-weight: 600;
      }
      .debug .lbl {
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <div class="logo">
          <div class="logo-mark">CT</div>
          <div>
            <div class="logo-text">Integration SDK</div>
            <div class="logo-sub">CleverTap Web Demo</div>
          </div>
        </div>

        <div class="tabs">
          <button
            class="tab active"
            id="tab-login"
            onclick="switchTab('login')"
          >
            Log In
          </button>
          <button class="tab" id="tab-signup" onclick="switchTab('signup')">
            Sign Up
          </button>
        </div>

        <form class="form visible" id="form-login" onsubmit="doLogin(event)">
          <div class="field">
            <label>Name</label>
            <input
              id="login-name"
              type="text"
              placeholder="Your full name"
              required
            />
          </div>
          <div class="field">
            <label>Identity</label>
            <input
              id="login-identity"
              type="text"
              placeholder="e.g. abc123-sp"
              required
            />
          </div>
          <div class="field">
            <label>Email</label>
            <input
              id="login-email"
              type="email"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="field">
            <label>Phone</label>
            <div class="phone-row">
              <input
                class="country-code"
                id="login-country"
                type="text"
                value="+91"
              />
              <input
                id="login-phone"
                type="tel"
                placeholder="9876543210"
                required
                style="flex: 1"
              />
            </div>
          </div>
          <button class="btn btn-primary" type="submit">Log In</button>
        </form>

        <form class="form" id="form-signup" onsubmit="doSignup(event)">
          <div class="field">
            <label>Name</label>
            <input
              id="signup-name"
              type="text"
              placeholder="Your full name"
              required
            />
          </div>
          <div class="field">
            <label>Identity</label>
            <input
              id="signup-identity"
              type="text"
              placeholder="e.g. newuser10-sp"
              required
            />
          </div>
          <div class="field">
            <label>Email</label>
            <input
              id="signup-email"
              type="email"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="field">
            <label>Phone</label>
            <div class="phone-row">
              <input
                class="country-code"
                id="signup-country"
                type="text"
                value="+91"
              />
              <input
                id="signup-phone"
                type="tel"
                placeholder="9876543210"
                required
                style="flex: 1"
              />
            </div>
          </div>
          <button class="btn btn-primary" type="submit">Create Account</button>
        </form>

        <div class="debug">
          <span class="lbl">CT init ID (our random_uuid-sp):</span>
          <strong id="dbg-initid">—</strong><br />
          <span class="lbl">ct_prefs.clevertap_id:</span>
          <strong id="dbg-ctid">—</strong><br />
          <span class="lbl">has_real_identity:</span>
          <strong id="dbg-identity">—</strong><br />
          <span class="lbl">isFirstTimeSignup:</span>
          <strong id="dbg-firstsignup">—</strong><br />
          <span class="lbl">WZRK_G (CT's internal):</span>
          <strong id="dbg-wzrk">—</strong><br />
          <span class="lbl">Dashboard key:</span>
          <strong id="dbg-dashboard">—</strong>
        </div>
      </div>
    </div>
    <div id="toast"></div>

    <script src="clevertap-id-manager.js"></script>
    <script src="clevertap-manager.js"></script>
    <script>
      CleverTapManager.init();
      updateDebugPanel();

      function switchTab(tab) {
        document
          .getElementById("form-login")
          .classList.toggle("visible", tab === "login");
        document
          .getElementById("form-signup")
          .classList.toggle("visible", tab === "signup");
        document
          .getElementById("tab-login")
          .classList.toggle("active", tab === "login");
        document
          .getElementById("tab-signup")
          .classList.toggle("active", tab === "signup");
      }

      function doLogin(e) {
        e.preventDefault();
        const identity = document.getElementById("login-identity").value.trim();
        const profile = {
          Name: document.getElementById("login-name").value.trim(),
          Identity: identity,
          Email: document.getElementById("login-email").value.trim(),
          Phone:
            document.getElementById("login-country").value +
            document.getElementById("login-phone").value.trim(),
          "MSG-email": true,
          "MSG-push": true,
          "MSG-sms": true,
          "MSG-whatsapp": true,
        };
        CleverTapManager.onUserLogin(profile, identity);
        showToast("Logged in!");
        updateDebugPanel();
        setTimeout(() => {
          window.location.href = "home.html";
        }, 800);
      }

      function doSignup(e) {
        e.preventDefault();
        const identity = document
          .getElementById("signup-identity")
          .value.trim();
        const profile = {
          Name: document.getElementById("signup-name").value.trim(),
          Identity: identity,
          Email: document.getElementById("signup-email").value.trim(),
          Phone:
            document.getElementById("signup-country").value +
            document.getElementById("signup-phone").value.trim(),
          "MSG-email": true,
          "MSG-push": true,
          "MSG-sms": true,
          "MSG-whatsapp": true,
        };

        if (CleverTapIdManager.isFirstTimeSignup()) {
          CleverTapManager.onFirstSignup(profile, identity);
        } else {
          CleverTapManager.onUserLogin(profile, identity);
        }
        showToast("Account created!");
        updateDebugPanel();
        setTimeout(() => {
          window.location.href = "home.html";
        }, 800);
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2800);
      }

      function updateDebugPanel() {
        const initId = window.__CT_INIT_ID__ || "—";
        const ctId = localStorage.getItem("ct_prefs.clevertap_id") || "—";
        const hasId =
          localStorage.getItem("ct_prefs.has_real_identity") || "false";
        const isFirst = CleverTapIdManager.isFirstTimeSignup();
        const wzrk =
          localStorage.getItem("WZRK_G") || "(not set yet — CT SDK async)";
        document.getElementById("dbg-initid").textContent = initId;
        document.getElementById("dbg-ctid").textContent = ctId;
        document.getElementById("dbg-identity").textContent = hasId;
        document.getElementById("dbg-firstsignup").textContent =
          String(isFirst);
        document.getElementById("dbg-wzrk").textContent = wzrk;
        document.getElementById("dbg-dashboard").textContent =
          hasId === "true" ? "_w_" + ctId : "_w_" + initId + " (anonymous)";
      }
    </script>
  </body>
</html>
