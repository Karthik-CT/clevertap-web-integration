      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
      }

      a[x-apple-data-detectors] {
        color: inherit !important;
        text-decoration: inherit !important;
      }

      #MessageViewBody a {
        color: inherit;
        text-decoration: none;
      }
      p {
        line-height: inherit;
      }

      .desktop_hide,
      .desktop_hide table {
        mso-hide: all;
        display: none;
        max-height: 0;
        overflow: hidden;
      }

      .image_block img + div {
        display: none;
      }
      sub,
      sup {
        font-size: 75%;
        line-height: 0;
      }

      @media (max-width: 500px) {
        .mobile_hide {
          display: none;
        }
        .row-content {
          width: 100% !important;
        }
        .stack .column {
          width: 100%;
          display: block;
        }
        .mobile_hide {
          min-height: 0;
          max-height: 0;
          max-width: 0;
          overflow: hidden;
          font-size: 0;
        }
        .desktop_hide,
        .desktop_hide table {
          display: table !important;
          max-height: none !important;
        }
        .row-5 .column-1 .block-1.spacer_block {
          height: 20px !important;
        }
      }

      body {
        font-family: Open Sans, Helvetica, sans-serif;
        margin: 0;
        padding: 5%;
      }

      hr {
        clear: both;
        border: 0;
        border-top: 2px solid #999;
        margin: 2em 0;
      }

      /* Emoji rating styling START */
      .emoji-result-text {
        font-size: 20px;
        margin-top: 25px;
        text-align: center;
        background: #f4d348;
        padding: 20px;
        border-radius: 8px;
        font-weight: 800;
      }

      .emoji-container {
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Helvetica, sans-serif;
        margin: 0;
      }

      #emoji input[type="radio"] {
        -webkit-appearance: none;
        width: 35px !important;
        height: 35px;
        border: none;
        cursor: pointer;
        transition: border 0.2s ease;
        filter: grayscale(100%);
        margin: 0 20px;
        transition: all 0.2s ease;
      }

      #emoji input[type="radio"]:hover,
      #emoji input[type="radio"]:checked {
        filter: grayscale(0);
      }

      #emoji input[type="radio"]:focus {
        outline: 0;
      }

      #emoji input[type="radio"].emoji-5 {
        background: url("https://d30a1bfupaeobl.cloudfront.net/images/WR5-55K-KZ7Z/star-icon-0-5.png")
          center;
        background-size: cover;
      }

      #emoji input[type="radio"].emoji-4 {
        background: url("https://d30a1bfupaeobl.cloudfront.net/images/WR5-55K-KZ7Z/star-icon-0-4.png")
          center;
        background-size: cover;
      }

      #emoji input[type="radio"].emoji-3 {
        background: url("https://d30a1bfupaeobl.cloudfront.net/images/WR5-55K-KZ7Z/star-icon-0-3.png")
          center;
        background-size: cover;
      }

      #emoji input[type="radio"].emoji-2 {
        background: url("https://d30a1bfupaeobl.cloudfront.net/images/WR5-55K-KZ7Z/star-icon-0-2.png")
          center;
        background-size: cover;
      }

      #emoji input[type="radio"].emoji-1 {
        background: url("https://d30a1bfupaeobl.cloudfront.net/images/WR5-55K-KZ7Z/star-icon-0-1up.png")
          center;
        background-size: cover;
      }

      #emoji input[type="radio"].emoji-5:hover,
      #emoji input[type="radio"].emoji-5:checked {
        background: url("https://d30a1bfupaeobl.cloudfront.net/images/WR5-55K-KZ7Z/star-icon-5.png")
          center;
        background-size: cover;
      }

      #emoji input[type="radio"].emoji-4:hover,
      #emoji input[type="radio"].emoji-4:checked {
        background: url("https://d30a1bfupaeobl.cloudfront.net/images/WR5-55K-KZ7Z/star-icon-4.png")
          center;
        background-size: cover;
      }

      #emoji input[type="radio"].emoji-3:hover,

        background-size: cover;

        background: url("https://d30a1bfupaeobl.cloudfront.net/images/WR5-55K-KZ7Z/star-icon-2.png")
          center;
        background-size: cover;
      }

      #emoji input[type="radio"].emoji-1:hover,
      #emoji input[type="radio"].emoji-1:checked {
        background: url("https://d30a1bfupaeobl.cloudfront.net/images/WR5-55K-KZ7Z/star-icon-1up.png")
          center;
        background-size: cover;
      }

      #emoji label {
        display: inline-block;
        text-align: center;
        margin: 0 0.6em;
        font-size: 14px;
      }

      #emoji label input[type="radio"] {
        display: block;
        margin: 0.5em auto;
      }

      .mtt {
        position: fixed;
        bottom: 10px;
        right: 20px;
        color: #999;
        text-decoration: none;
      }

      .mtt span {
        color: #e74c3c;
      }

      .mtt span:hover {
        color: #666;
      }

      .mtt span span {
        color: #c0392b;
      }

      #customer_reply_form textarea {
        width: 95%;
        height: 80px;
        padding: 12px 20px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
        resize: none;
      }

      #customer_reply_form textarea::placeholder {
        opacity: 0.36;
        color: #000;
        font-size: 13px;
      }

      #submit_choice {
        cursor: pointer;
      }
    </style>

    <script type="text/javascript">
      var isAndroid = /Android/i.test(navigator.userAgent);
      var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

      const store = isAndroid
        ? {
            label: "Play Store",
            url: "https://play.google.com/store/apps/details?id=com.wefaq.carsapp",
          }
        : {
            label: "App Store",
            url: "https://apps.apple.com/us/app/yelo-%D9%8A%D9%84%D9%88/id923853721",
          };
      const ratingLink = document.getElementById("rating-link");
      ratingLink.href = store.url;
      ratingLink.textContent = `by rating Yelo on ${store.label}`;

      console.log("ratingLink", ratingLink);
      function track_rating_event(rating) {
        var eventName = "Rating Submitted";
        var properties = {
          "User Rating": rating,
        };
        if (
          isIOS &&
          window.webkit &&
          window.webkit.messageHandlers &&
          window.webkit.messageHandlers.clevertap
        ) {
          window.webkit.messageHandlers.clevertap.postMessage({
            action: "recordEventWithProps",
            event: eventName,
            properties: properties,
          });
          window.location.href = "wzrk://exit";
          console.log("iOS event sent");
        } else if (isAndroid && window.CleverTap) {
          CleverTap.pushEvent(eventName, JSON.stringify(properties));
          window.location.href = "wzrk://exit"; // Close the webview
          console.log("Android event sent");
        } else {
          console.error("Unsupported OS or CleverTap objet not found");
        }
      }
      function submit_choice_done() {
        var selectedOption = document.querySelector(
          "input[type='radio'][name='rating_choice']:checked"
        ).value;
        track_rating_event(selectedOption);
        document.getElementById("form_view").style.display = "none";

        if (selectedOption > 3) {
          document.getElementById("thank_you_view").style.display = "block";
        } else {
          document.getElementById("thank_you_reply_view").style.display =
            "block";
        }
      }
    </script>
