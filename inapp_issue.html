    <style>
      :root {
        --sp-accent: #7afffb;
        --sp-focus: #ffffff;
        --sp-slate: #424242;
        --sp-body: #000000;
        --sp-pop: #1a1a1a;
        --sp-light: #ffffff;
        --sp-fade: #d4d1d1;
        --sp-w06: rgba(255, 255, 255, 0.06);
        --sp-w12: rgba(255, 255, 255, 0.12);
        --sp-grad: linear-gradient(
          120deg,
          var(--sp-light) 0%,
          var(--sp-accent) 100%
        );
        --sp-font:
          "Averta", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial,
          sans-serif;
        --sp-font-ar:
          "SF Arabic", "Geeza Pro", "Noto Sans Arabic", "Noto Naskh Arabic",
          "Tajawal", -apple-system, "Helvetica Neue", Arial, sans-serif;
        --sp-pad-x: 16px;
        --sp-safe-top: max(env(safe-area-inset-top, 0px), 8px);
        --sp-safe-bottom: max(env(safe-area-inset-bottom, 0px), 8px);
        --sp-safe-left: env(safe-area-inset-left, 0px);
        --sp-safe-right: env(safe-area-inset-right, 0px);
        --sp-tile-w: clamp(148px, 44vw, 192px);
        --sp-tile-w-b: clamp(72px, 22vw, 96px);
        --sp-inset: 10px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        font-family: var(--sp-font);
        color: var(--sp-light);
        -webkit-tap-highlight-color: transparent;
      }
      html[dir="rtl"] body {
        font-family: var(--sp-font-ar);
      }
      .sp-root {
        position: fixed;
        top: calc(var(--sp-safe-top) + var(--sp-inset));
        bottom: calc(var(--sp-safe-bottom) + var(--sp-inset));
        left: calc(var(--sp-safe-left) + var(--sp-inset));
        right: calc(var(--sp-safe-right) + var(--sp-inset));
        display: flex;
        flex-direction: column;
        background: var(--sp-body);
        border: 1px solid var(--sp-w12);
        border-radius: 26px;
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.22s ease;
        animation: spReveal 0.01s linear 1.2s forwards;
      }
      .sp-root.is-ready {
        opacity: 1;
        animation: none;
      }
      @keyframes spReveal {
        to {
          opacity: 1;
        }
      }
      .sp-hero {
        position: absolute;
        inset: 0;
        z-index: 0;
        background-position: top center;
        background-repeat: no-repeat;
        background-size: cover;
        opacity: 0;
        transition: opacity 0.45s ease;
        pointer-events: none;
      }
      .sp-hero.is-on {
        opacity: 1;
      }
      .sp-hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.18) 0%,
          rgba(0, 0, 0, 0.5) 14%,
          rgba(0, 0, 0, 0.86) 28%,
          #000 42%
        );
      }
      .sp-head,
      .sp-stage,
      .sp-foot {
        position: relative;
        z-index: 1;
      }
      .sp-head {
        flex: 0 0 auto;
        text-align: center;
        padding: 12px var(--sp-pad-x) 2px;
      }
      .sp-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding-inline: 52px;
      }
      .sp-lang {
        display: flex;
        direction: ltr;
        background: var(--sp-w06);
        border: 1px solid var(--sp-w12);
        border-radius: 999px;
        padding: 2px;
      }
      .sp-lang-btn {
        min-width: 44px;
        min-height: 32px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 0;
        border-radius: 999px;
        color: var(--sp-fade);
        font-family: var(--sp-font);
        font-size: 0.75rem;
        font-weight: 700;
        cursor: pointer;
      }
      .sp-lang-btn[lang="ar"] {
        font-family: var(--sp-font-ar);
        font-size: 0.8125rem;
      }
      .sp-lang-btn[aria-pressed="true"] {
        background: var(--sp-light);
        color: #000;
      }
      .sp-lang-btn:focus-visible {
        outline: 3px solid var(--sp-accent);
        outline-offset: 2px;
      }
      .sp-complogo {
        height: 40px;
        width: auto;
        display: block;
        margin: 8px auto 0;
      }
      .sp-stage {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        overflow-y: auto;
        scrollbar-width: none;
        padding: 4px 0 8px 0;
        text-align: center;
      }
      .sp-stage::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }
      .sp-stage > :first-child {
        margin-top: auto;
      }
      .sp-stage > :last-child {
        margin-bottom: auto;
      }
      .sp-card {
        width: 100%;
        max-width: 460px;
        margin: 0 auto;
        min-width: 0;
        padding-left: var(--sp-pad-x);
        padding-right: var(--sp-pad-x);
      }
      .sp-title {
        margin: 4px auto 0;
        max-width: 20ch;
        font-size: clamp(1.75rem, 8.6vw, 2.375rem);
        font-weight: 900;
        line-height: 1.08;
        letter-spacing: -0.015em;
        background: var(--sp-grad);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: var(--sp-light);
      }
      html[dir="rtl"] .sp-title {
        letter-spacing: normal;
        line-height: 1.26;
      }
      .sp-price {

        margin: 10px auto 0;
        padding: 6px 15px;
        border: 1px solid rgba(122, 255, 251, 0.45);
        border-radius: 999px;
        background: rgba(122, 255, 251, 0.1);
        color: var(--sp-accent);
        font-size: clamp(0.875rem, 4vw, 1rem);
        font-weight: 700;
        line-height: 1.3;
      }
      .sp-root.is-priced .sp-price {
        display: inline-block;
      }
      .sp-body {
        margin: 10px auto 0;
        max-width: 34ch;
        font-size: clamp(0.8125rem, 3.6vw, 0.9375rem);
        line-height: 1.45;
        color: var(--sp-fade);
      }
      .sp-reel {
        position: relative;
        margin-top: 14px;
        overflow: hidden;
        width: 100%;
        min-width: 0;
        direction: ltr;
        -webkit-mask-image: linear-gradient(
          to right,
          transparent,
          #000 9%,
          #000 91%,
          transparent
        );
        mask-image: linear-gradient(
          to right,
          transparent,
          #000 9%,
          #000 91%,
          transparent
        );
      }
      .sp-reel.is-empty {
        display: none;
      }
      .sp-reel-track {
        display: flex;
        width: max-content;
        direction: ltr;
        animation: spReel 44s linear infinite;
      }
      html[dir="rtl"] .sp-reel-track {
        animation-direction: reverse;
      }
      .sp-reel-b {
        margin-top: 8px;
      }
      .sp-reel-b .sp-reel-track {
        animation-direction: reverse;
        animation-duration: 53s;
        animation-delay: -19s;
      }
      html[dir="rtl"] .sp-reel-b .sp-reel-track {
        animation-direction: normal;
      }
      @keyframes spReel {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(calc(var(--sp-shift) * -1));
        }
      }
      .sp-reel {
        --sp-shift: calc((var(--sp-tile-w) + 8px) * 10);
      }
      .sp-reel-b {
        --sp-shift: calc((var(--sp-tile-w-b) + 8px) * 5);
      }
      .sp-tile {
        flex: 0 0 auto;
        width: var(--sp-tile-w);
        height: calc(var(--sp-tile-w) * 600 / 1400);
        margin-right: 8px;
        border-radius: 10px;
        overflow: hidden;
        background: var(--sp-w06);
        border: 1px solid var(--sp-w06);
      }
      .sp-reel-b .sp-tile {
        width: var(--sp-tile-w-b);
        height: calc(var(--sp-tile-w-b) * 675 / 475);
      }
      .sp-tile.is-dead {
        display: none;
      }
      .sp-tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .sp-bens {

        align-items: flex-start;
        justify-content: center;
        gap: 6px;
        margin: 14px auto 0;

        color: var(--sp-fade);

      .sp-foot {

        border-top: 1px solid var(--sp-w06);
      }
      .sp-cta {

        align-items: center;
        justify-content: center;
        gap: 8px;

        max-width: 460px;
        margin: 0 auto;

        padding: 8px 16px;

        color: #000;
        border: 0;
        border-radius: 10px;
        font: inherit;
        font-size: clamp(0.9375rem, 4vw, 1.0625rem);
        font-weight: 700;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.12s ease;
      }
      .sp-cta:active {
        transform: scale(0.98);
      }
      .sp-cta:focus-visible {
        outline: 3px solid var(--sp-accent);
        outline-offset: 2px;
      }
      .sp-dismiss {
        display: block;
        width: 100%;
        max-width: 240px;
        margin: 8px auto 0;
        min-height: 44px;
        padding: 6px 16px;
        background: transparent;
        color: var(--sp-fade);
        border: 1px solid var(--sp-w12);
        border-radius: 10px;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 700;
        cursor: pointer;
      }
      .sp-dismiss:active {
        background: var(--sp-w06);
      }
      .sp-dismiss:focus-visible {
        outline: 3px solid var(--sp-accent);
        outline-offset: 2px;
      }
      .sp-alt {
        display: block;
        margin: 10px auto 0;
        padding: 6px 4px;
        font-size: 0.8125rem;
        line-height: 1.35;
        text-align: center;
        color: var(--sp-fade);
        text-decoration: none;
        cursor: pointer;
      }
      .sp-alt b {
        color: var(--sp-accent);
        font-weight: 700;
        text-decoration: underline;
      }
      .sp-alt:focus-visible {
        outline: 3px solid var(--sp-accent);
        outline-offset: 2px;
      }

      .sp-fine {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        flex-wrap: wrap;
        margin: 8px auto 0;
        max-width: 460px;
        font-size: 0.6875rem;
        line-height: 1.35;
        color: #8c8c8c;

        .sp-price {
          margin-top: 8px;
        }
        .sp-body {
          margin-top: 8px;
        }
        .sp-alt {
          margin-top: 6px;
        }
        .sp-fine {
          margin-top: 6px;
        }
        .sp-foot {
          padding-top: 8px;
          padding-bottom: 8px;
        }
        .sp-complogo {
          height: 32px;
        }
        .sp-title {
          font-size: clamp(1.5rem, 7.4vw, 1.875rem);
        }
        .sp-reel {
          margin-top: 10px;
        }
        .sp-bens {
          margin-top: 10px;
        }

        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);

        position: fixed;
        inset-inline: 0;
        bottom: 0;

        white-space: pre-wrap;
        display: none;
        direction: ltr;

      }
      .sp-debug.is-on {
        display: block;
      }
      @media (prefers-reduced-motion: reduce) {
        .sp-root,
        .sp-hero,
        .sp-cta {
          transition: none !important;
        }
        .sp-cta:active {
          transform: none;
        }
        .sp-reel-track {
          animation: none !important;
        }
      }
    </style>
  </head>

            title: "3 \u0623\u064a\u0627\u0645 \u062a\u062c\u0631\u0628\u0629 \u0645\u062c\u0627\u0646\u064a\u0629",
            price: "\u062b\u0645 17.5 \u062f.\u0645 \u0643\u0644 \u0623\u0633\u0628\u0648\u0639",
            body: "\u0634\u0627\u0647\u062f \u0627\u0644\u062f\u0648\u0631\u064a \u0627\u0644\u0625\u064a\u0637\u0627\u0644\u064a \u0645\u0628\u0627\u0634\u0631\u0629\u060c \u0645\u0639 \u0645\u0633\u0644\u0633\u0644\u0627\u062a \u062d\u0635\u0631\u064a\u0629 \u0648\u0623\u062d\u062f\u062b \u0627\u0644\u0623\u0641\u0644\u0627\u0645 \u0648\u0627\u0644\u0645\u0632\u064a\u062f.",
            ben1: "\u0623\u062c\u0647\u0632\u0629 \u0645\u062a\u0639\u062f\u062f\u0629",
            ben2: "\u0625\u0644\u063a\u0627\u0621 \u0641\u064a \u0623\u064a \u0648\u0642\u062a",
            ben3: "\u0645\u0634\u0627\u0647\u062f\u0629 \u0628\u062f\u0648\u0646 \u0625\u0646\u062a\u0631\u0646\u062a",
            cta: "\u0627\u0628\u062f\u0623 \u062a\u062c\u0631\u0628\u062a\u0643 \u0627\u0644\u0645\u062c\u0627\u0646\u064a\u0629",
            dismiss: "\u0644\u064a\u0633 \u0627\u0644\u0622\u0646",
            altPre: "\u0644\u0633\u062a \u0645\u0646 \u0639\u0645\u0644\u0627\u0621 Maroc Telecom \u061f ",
            altLink: "\u0627\u0636\u063a\u0637 \u0647\u0646\u0627",
            fine: "\u0647\u0630\u0647 \u0627\u0644\u062e\u062f\u0645\u0629 \u0641\u0642\u0637 \u0644\u0639\u0645\u0644\u0627\u0621 Maroc Telecom \u00b7 \u062a\u062a\u062c\u062f\u062f \u062a\u0644\u0642\u0627\u0626\u064a\u064b\u0627 \u0628\u0639\u062f \u0627\u0644\u062a\u062c\u0631\u0628\u0629 \u00b7 \u064a\u0645\u0643\u0646\u0643 \u0627\u0644\u0625\u0644\u063a\u0627\u0621 \u0641\u064a \u0623\u064a \u0648\u0642\u062a",
            logoAlt: "\u0627\u0644\u062f\u0648\u0631\u064a \u0627\u0644\u0625\u064a\u0637\u0627\u0644\u064a",
            opAlt: "Maroc Telecom",
          },
          fr: {
            dir: "ltr",
            htmlLang: "fr",
            title: "3 jours d'essai gratuit",
            price: "Puis 17,5 MAD par semaine",
            body: "Regardez la Serie A en direct, avec des s\u00e9ries exclusives, les derniers films et plus encore.",
            ben1: "Tous vos \u00e9crans",
            ben2: "Annulable \u00e0 tout moment",
            ben3: "Hors ligne",
            cta: "D\u00e9marrer mon essai gratuit",
            dismiss: "Plus tard",
            altPre: "Vous n'\u00eates pas client Maroc Telecom ? ",
            altLink: "Cliquez ici",
            fine: "R\u00e9serv\u00e9 aux clients Maroc Telecom \u00b7 Renouvellement automatique apr\u00e8s l'essai \u00b7 Annulable \u00e0 tout moment",
            logoAlt: "Serie A",
            opAlt: "Maroc Telecom",
          },
          en: {
            dir: "ltr",
            htmlLang: "en",
            title: "3 days free trial",
            price: "Then 17.5 MAD per week",
            body: "Watch Serie A live, plus exclusive series, the latest movies and more.",
            ben1: "All your devices",
            ben2: "Cancel any time",
            ben3: "Watch offline",
            cta: "Start my free trial",
            dismiss: "Not now",
            altPre: "Not a Maroc Telecom customer? ",
            altLink: "Click here",
            fine: "Only for Maroc Telecom customers \u00b7 Renews automatically after your trial \u00b7 Cancel any time",
            logoAlt: "Serie A",
            opAlt: "Maroc Telecom",
          },
        };
        var T = COPY[CONFIG.lang] || COPY.ar;
        var Bridge = (function () {
          var log = [],
            cached,
            cachedDone = false;
          function note(m) {
            log.push(m);
            if (CONFIG.debug) {
              var el = document.getElementById("spDebug");
              if (el) {
                el.classList.add("is-on");
                el.textContent = log.join("\n");
              }
            }
            try {
              console.log("[CT] " + m);
            } catch (e) {}
          }
          function resolve() {
            if (cachedDone) return cached;
            cachedDone = true;
            cached = null;
            var names = ["clevertap", "CleverTap"],
              i;
            for (i = 0; i < names.length; i++) {
              try {
                var o = window[names[i]];
                if (o && typeof o.pushEvent === "function") {
                  cached = {
                    kind: "android",
                    obj: o,
                    name: "window." + names[i],
                  };
                  note("bridge = ANDROID via " + cached.name);
                  return cached;
                }
              } catch (e) {}
            }
            try {
              var mh = window.webkit && window.webkit.messageHandlers;
              if (mh) {
                for (i = 0; i < names.length; i++) {
                  if (
                    mh[names[i]] &&
                    typeof mh[names[i]].postMessage === "function"
                  ) {
                    cached = {
                      kind: "ios",
                      handler: mh[names[i]],
                      name: "webkit.messageHandlers." + names[i],
                    };
                    note("bridge = IOS via " + cached.name);
                    return cached;
                  }
                }
                note(
                  "webkit.messageHandlers present but no clevertap key. keys=" +
                    Object.keys(mh).join(","),
                );
              }
            } catch (e) {
              note("iOS probe threw: " + e);
            }
            note("NO BRIDGE FOUND (running outside the app?)");
            return cached;
          }
          function post(msg, label) {
            var b = resolve();
            if (!b || b.kind !== "ios") return false;
            try {
              b.handler.postMessage(msg);
              note("iOS " + label + " OK");
              return true;
            } catch (e) {
              note("iOS " + label + " threw: " + e);
              return false;
            }
          }
          function pushEvent(name, props) {
            var b = resolve();
            if (!b) {
              note("WOULD FIRE " + name + " " + JSON.stringify(props));
              return false;
            }
            if (b.kind === "android") {
              try {
                b.obj.pushEvent(name, JSON.stringify(props));
                note("AND pushEvent OK " + name);
                return true;
              } catch (e) {
                note("AND pushEvent threw: " + e);
                return false;
              }
            }
            return post(
              {
                action: "recordEventWithProps",
                event: name,
                properties: props,
              },
              "pushEvent " + name,
            );
          }
          function openUrl(url, cta, buttonId) {
            var b = resolve();
            var actionJson = {
              type: "open-url",
              android: url,
              ios: url,
              url: url,
            };

            if (!b) {
              note("WOULD OPEN " + url);
              return false;
            }

            if (b.kind === "android") {
              if (typeof b.obj.triggerInAppAction !== "function") {
                note(
                  "AND triggerInAppAction MISSING \u2014 SDK too old (needs 7.x+)",
                );
                return false;
              }
              try {
                b.obj.triggerInAppAction(
                  JSON.stringify(actionJson),
                  cta,
                  buttonId,
                );
                note("AND triggerInAppAction OK -> " + url);
                return true;
              } catch (e) {
                note("AND triggerInAppAction threw: " + e);
                return false;
              }
            }
            return post(
              {
                action: "triggerInAppAction",
                actionJson: actionJson,
                callToAction: cta,
                buttonId: buttonId,
              },
              "openUrl",
            );
          }
          function dismiss() {
            var b = resolve();
            if (!b) {
              note("no bridge \u2014 DOM hide only");
              var r = document.getElementById("spRoot");
              if (r) r.style.display = "none";
              return;
            }
            if (b.kind === "android") {
              try {
                b.obj.dismissInAppNotification();
                note("AND dismiss OK");
              } catch (e) {
                note("AND dismiss threw: " + e);
              }
              return;
            }
            post({ action: "dismissInAppNotification" }, "dismiss");
          }
          return {
            pushEvent: pushEvent,
            openUrl: openUrl,
            dismiss: dismiss,
            note: note,
          };
        })();
        function liquid(raw) {
          if (typeof raw !== "string") return "";
          var v = raw.trim();
          if (!v) return "";
          if (v.indexOf("{" + "{") !== -1 || v.indexOf("}" + "}") !== -1)
            return "";
          if (v === "undefined" || v === "null") return "";
          return v;
        }
        function ctCampaignIdForEvent() {
          return liquid(CONFIG.ctCampaignIdRaw) || "unset";
        }
        function ctCampaignIdForUrl() {
          var v = liquid(CONFIG.ctCampaignIdRaw);
          return v === "0_0" ? "" : v;
        }

        function makeClickId() {
          var rnd = "",
            i;
          try {
            var a = new Uint8Array(8);
            (window.crypto || window.msCrypto).getRandomValues(a);
            for (i = 0; i < a.length; i++)
              rnd += ("0" + a[i].toString(16)).slice(-2);
          } catch (e) {
            rnd =
              Math.random().toString(16).slice(2, 10) +
              Math.random().toString(16).slice(2, 10);
          }
          return "ct" + Date.now().toString(36) + rnd;
        }
        function buildUrl(base, clickId, extraPairs) {
          var pairs = [
            ["utm_source", "clevertap"],
            ["utm_medium", "inapp"],
            ["utm_campaign", CONFIG.utmCampaign],
            ["utm_content", CONFIG.variant + "_" + CONFIG.lang],
            ["click_id", clickId],
            ["ct_campaign_id", ctCampaignIdForUrl()],
            ["sp_variant", CONFIG.variant],
            ["sp_lang", CONFIG.lang],
          ];
          if (extraPairs) pairs = pairs.concat(extraPairs);

          var q = [],
            i,
            k,
            v;
          for (i = 0; i < pairs.length; i++) {
            k = pairs[i][0];
            v = pairs[i][1];
            if (v === null || v === undefined) continue;
            v = String(v).trim();
            if (!v || v === "undefined" || v === "null") continue;
            q.push(encodeURIComponent(k) + "=" + encodeURIComponent(v));
          }
          return base + (base.indexOf("?") === -1 ? "?" : "&") + q.join("&");
        }
        function dcbUrl(clickId) {
          var base = CONFIG.destUrl;
          if (CONFIG.localiseDestPath && CONFIG.destPathByLang[CONFIG.lang]) {
            base = CONFIG.destPathByLang[CONFIG.lang];
          }
          return buildUrl(base, clickId);
        }
        function altUrl(clickId) {
          var base =
            CONFIG.landingByLang[CONFIG.lang] || CONFIG.landingByLang.en;
          return buildUrl(base, clickId, [["sp_route", "non_carrier"]]);
        }
        var state = {
          shownAt: Date.now(),
          langSwitches: 0,
          clickId: null,
          done: false,
        };
        function deviceType() {
          return window.innerWidth >= 600 ? "tablet" : "mobile";
        }
        function osGuess() {
          var u = navigator.userAgent || "";
          if (/iPhone|iPad|iPod/i.test(u)) return "ios";
          if (/Android/i.test(u)) return "android";
          return "unknown";
        }
        function secsSince(t) {
          return t ? Math.round((Date.now() - t) / 1000) : null;
        }
        function fireEvent(action, extra) {
          var p = {
            action: action,
            trigger_source: CONFIG.triggerSource,
            campaign_name: CONFIG.campaignName,
            placement: CONFIG.placement,
            channel: CONFIG.channel,
            language: CONFIG.lang,
            language_switches: state.langSwitches,
            device_type: deviceType(),
            os: osGuess(),
            timestamp: new Date().toISOString(),
            dwell_time_sec: secsSince(state.shownAt),
            /* --- new for this campaign --- */
            variant: CONFIG.variant,
            campaign_id: ctCampaignIdForEvent(),
            country: CONFIG.country,
            carrier_target: CONFIG.carrierTarget,
            price_shown: CONFIG.variant === "B",
            offer: "free_trial_3d",
          };
          if (state.clickId) p.click_id = state.clickId;
          if (extra)
            for (var k in extra) if (extra.hasOwnProperty(k)) p[k] = extra[k];
          Bridge.pushEvent(CONFIG.eventName, p);
        }
        var els = {
          root: document.getElementById("spRoot"),
          hero: document.getElementById("spHero"),
          compLogo: document.getElementById("spCompLogo"),
          title: document.getElementById("spTitle"),
          price: document.getElementById("spPrice"),
          body: document.getElementById("spBody"),
          reelA: document.getElementById("spReelA"),
          reelTrackA: document.getElementById("spReelTrackA"),
          reelB: document.getElementById("spReelB"),
          reelTrackB: document.getElementById("spReelTrackB"),
          ben1: document.getElementById("spBen1"),
          ben2: document.getElementById("spBen2"),
          ben3: document.getElementById("spBen3"),
          cta: document.getElementById("spCta"),
          ctaLabel: document.getElementById("spCtaLabel"),
          dismiss: document.getElementById("spDismiss"),
          alt: document.getElementById("spAlt"),
          fine: document.getElementById("spFine"),
          fineText: document.getElementById("spFineText"),
          opLogo: document.getElementById("spOpLogo"),
          opText: document.getElementById("spOpText"),
          langAr: document.getElementById("spLangAr"),
          langFr: document.getElementById("spLangFr"),
          langEn: document.getElementById("spLangEn"),
        };
        function buildReel(reelEl, trackEl, urls) {
          urls = urls || [];
          if (!urls.length) {
            reelEl.classList.add("is-empty");
            return;
          }
          var aliveUrls = urls.length;
          var frag = document.createDocumentFragment();
          var pass, i;
          function killUrl(idx) {
            var dead = trackEl.querySelectorAll('[data-idx="' + idx + '"]');
            if (!dead.length || dead[0].classList.contains("is-dead")) return;
            for (var d = 0; d < dead.length; d++)
              dead[d].classList.add("is-dead");
            if (--aliveUrls <= 0) reelEl.classList.add("is-empty");
          }
          for (pass = 0; pass < 2; pass++) {
            for (i = 0; i < urls.length; i++) {
              var tile = document.createElement("div");
              tile.className = "sp-tile";
              tile.setAttribute("data-idx", String(i));
              var img = document.createElement("img");
              img.alt = "";
              img.decoding = "async";
              img.setAttribute("data-idx", String(i));
              img.addEventListener("error", function () {
                killUrl(this.getAttribute("data-idx"));
              });
              img.src = urls[i];
              tile.appendChild(img);
              frag.appendChild(tile);
            }
          }
          trackEl.appendChild(frag);
        }
        function applyLocale() {
          T = COPY[CONFIG.lang] || COPY.ar;
          var h = document.documentElement;
          h.setAttribute("dir", T.dir);
          h.setAttribute("lang", T.htmlLang);

          els.title.textContent = T.title;
          els.price.textContent = T.price;
          els.body.textContent = T.body;
          els.ben1.textContent = T.ben1;
          els.ben2.textContent = T.ben2;
          els.ben3.textContent = T.ben3;
          els.ctaLabel.textContent = T.cta;
          els.dismiss.textContent = T.dismiss;
          els.fineText.textContent = T.fine;
          els.opText.textContent = T.opAlt;
          els.opLogo.alt = T.opAlt;
          els.alt.textContent = T.altPre;
          var b = document.createElement("b");
          b.textContent = T.altLink;
          els.alt.appendChild(b);

          els.langAr.setAttribute(
            "aria-pressed",
            CONFIG.lang === "ar" ? "true" : "false",
          );
          els.langFr.setAttribute(
            "aria-pressed",
            CONFIG.lang === "fr" ? "true" : "false",
          );
          els.langEn.setAttribute(
            "aria-pressed",
            CONFIG.lang === "en" ? "true" : "false",
          );
          els.compLogo.src =
            CONFIG.compLogoBase +
            (CONFIG.lang === "ar" ? CONFIG.compLogoAr : CONFIG.compLogoEn) +
            CONFIG.compLogoExt;
          els.compLogo.alt = T.logoAlt;
          els.cta.setAttribute("href", dcbUrl(state.clickId));
          els.alt.setAttribute("href", altUrl(state.clickId));

          if (CONFIG.debug) auditLengths();
        }

        function auditLengths() {
          var lim = { title: 45, body: 140 },
            k,
            l;
          for (l in COPY)
            if (COPY.hasOwnProperty(l)) {
              for (k in lim)
                if (lim.hasOwnProperty(k)) {
                  var n = COPY[l][k].length;
                  Bridge.note(
                    (n > lim[k] ? "OVERFLOW " : "ok ") +
                      l +
                      "." +
                      k +
                      " = " +
                      n +
                      "/" +
                      lim[k],
                  );
                }
            }
        }
        function onOutbound(e, which) {
          if (state.done) {
            if (e) e.preventDefault();
            return;
          }
          state.done = true;
          state.clickId = makeClickId();

          var isDcb = which === "dcb";
          var url = isDcb ? dcbUrl(state.clickId) : altUrl(state.clickId);
          var el = isDcb ? els.cta : els.alt;
          var btnId = isDcb
            ? "cta_dcb_" + CONFIG.variant
            : "cta_landing_" + CONFIG.variant;
          var label = isDcb ? T.cta : T.altLink;

          el.setAttribute("href", url);
          fireEvent(isDcb ? "cta_clicked" : "secondary_cta_clicked", {
            destination_url: url,
            click_id: state.clickId,
            link_target: isDcb ? "maroc_telecom_dcb" : "non_carrier_landing",
          });
          var opened = Bridge.openUrl(url, label, btnId);
          if (opened) {
            if (e) e.preventDefault();
            window.setTimeout(function () {
              fireEvent("dismissed", {
                dismiss_method: isDcb ? "cta_handoff" : "secondary_cta_handoff",
              });
              window.setTimeout(Bridge.dismiss, CONFIG.bridgeSettleMs);
            }, CONFIG.bridgeSettleMs);
          } else {
            Bridge.note(
              "openUrl failed \u2014 falling through to anchor navigation",
            );
            state.done = false;
          }
        }
        function onDismiss() {
          if (state.done) return;
          state.done = true;
          fireEvent("dismissed", { dismiss_method: "not_now_button" });
          window.setTimeout(Bridge.dismiss, CONFIG.bridgeSettleMs);
        }
        function setLang(lang) {
          if (lang === CONFIG.lang || !COPY[lang]) return;
          var from = CONFIG.lang;
          state.langSwitches++;
          fireEvent("language_switched", {
            language_from: from,
            language_to: lang,
          });
          CONFIG.lang = lang;
          applyLocale();
        }
        function loadHero() {
          if (!CONFIG.heroUrl) return;
          var pre = new Image();
          pre.onload = function () {
            els.hero.style.backgroundImage = 'url("' + CONFIG.heroUrl + '")';
            els.hero.classList.add("is-on");
          };
          pre.onerror = function () {
            Bridge.note("hero failed: " + CONFIG.heroUrl);
          };
          pre.src = CONFIG.heroUrl;
        }
        function boot() {
          if (CONFIG.debug)
            document.getElementById("spDebug").classList.add("is-on");
          if (CONFIG.variant === "B") els.root.classList.add("is-priced");

          loadHero();
          var reel = CONFIG.reelUrls || [];
          buildReel(els.reelA, els.reelTrackA, reel);
          buildReel(els.reelB, els.reelTrackB, CONFIG.reelUrlsB || []);
          els.compLogo.addEventListener("error", function () {
            els.compLogo.style.display = "none";
          });
          els.opLogo.addEventListener("error", function () {
            els.fine.classList.add("is-noimg");
          });
          if (!CONFIG.opLogoUrl) els.fine.classList.add("is-noimg");
          else els.opLogo.src = CONFIG.opLogoUrl;

          applyLocale();

          els.langAr.addEventListener("click", function () {
            setLang("ar");
          });
          els.langFr.addEventListener("click", function () {
            setLang("fr");
          });
          els.langEn.addEventListener("click", function () {
            setLang("en");
          });
          els.cta.addEventListener("click", function (e) {
            onOutbound(e, "dcb");
          });
          els.alt.addEventListener("click", function (e) {
            onOutbound(e, "landing");
          });
          els.dismiss.addEventListener("click", onDismiss);

          els.root.classList.add("is-ready");
          fireEvent("shown");
        }
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", boot);
        else boot();
      })();
    </script>
